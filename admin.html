<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECE-A Admin Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(135deg, #06101d, #0b1c31);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
            padding: 30px 0 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            color: #ffd34e;
            font-size: 38px;
        }

        .header p {
            color: #b8c5d3;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(13, 31, 51, 0.95);
            border: 1px solid #315477;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        .login-card {
            max-width: 600px;
            margin: 80px auto;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            border: 1px solid #55718d;
            background: #06101d;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2d8cff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border: 0;
            border-radius: 7px;
            background: #1769b5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2183dc;
        }

        .logout {
            background: #9d2525;
        }

        .logout:hover {
            background: #c83232;
        }

        .add {
            background: #197642;
        }

        .add:hover {
            background: #229b55;
        }

        .delete {
            background: #7d2020;
        }

        .delete:hover {
            background: #a52c2c;
        }

        .period-card {
            background: #081522;
            border: 1px solid #365574;
            border-radius: 10px;
            padding: 20px;
            margin-top: 18px;
        }

        .period-title {
            color: #ffd34e;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .save {
            background: #146caa;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-weight: bold;
        }

        .success {
            color: #4dde71;
        }

        .error {
            color: #ff6565;
        }

        .loading {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .top-bar button {
            margin-top: 0;
        }

        .info {
            color: #aebdcc;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                padding-top: 15px;
            }

            .header h1 {
                font-size: 28px;
            }

            .card {
                padding: 17px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         LOGIN SECTION
    ====================================== -->

    <div id="loginSection">

        <div class="card login-card">

            <div class="header">

                <h1>🔐 ECE-A ADMIN</h1>

                <p>
                    SSN COLLEGE OF ENGINEERING
                </p>

            </div>


            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter admin email"
                autocomplete="username"
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >


            <button onclick="login()">
                LOGIN
            </button>


            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </div>



    <!-- =====================================
         ADMIN SECTION
    ====================================== -->

    <div id="adminSection"
         style="display:none;">


        <div class="header">

            <h1>ECE-A ADMIN</h1>

            <p>
                SSN COLLEGE OF ENGINEERING
            </p>

        </div>


        <div class="card">

            <div class="top-bar">

                <button
                    class="add"
                    onclick="addPeriod()">

                    + ADD PERIOD

                </button>


                <button
                    class="logout"
                    onclick="logout()">

                    LOGOUT

                </button>

            </div>


            <div class="info">

                Changes made here are saved directly
                to Firebase and will appear on the
                public display automatically.

            </div>

        </div>


        <div class="card">

            <h2>📚 CLASS PERIODS</h2>

            <div id="periodList">

                <div class="loading">
                    Loading periods...
                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================
     FIREBASE SDK
====================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB9yO0eYwJm-lwFC5-TzFxqYtSdIxshpQ6-c",

    authDomain:
        "ece-a-class-display.firebaseapp.com",

    projectId:
        "ece-a-class-display",

    storageBucket:
        "ece-a-class-display.firebasestorage.app",

    messagingSenderId:
        "602913171442",

    appId:
        "1:602913171442:web:740f9ecd4bf298e866ad6b"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();



/* =========================================
   AUTHENTICATION STATE
========================================= */

auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById(
            "loginSection"
        ).style.display = "none";


        document.getElementById(
            "adminSection"
        ).style.display = "block";


        loadPeriods();

    }

    else {

        document.getElementById(
            "loginSection"
        ).style.display = "block";


        document.getElementById(
            "adminSection"
        ).style.display = "none";

    }

});



/* =========================================
   LOGIN
========================================= */

function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.className =
        "message";


    message.textContent =
        "Signing in...";


    if (!email || !password) {

        message.className =
            "message error";

        message.textContent =
            "Please enter email and password.";

        return;

    }


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(function() {

        message.textContent = "";

    })

    .catch(function(error) {

        console.error(
            "Firebase Login Error:",
            error
        );


        message.className =
            "message error";


        message.textContent =
            "Login failed: " +
            error.code;

    });

}



/* =========================================
   LOGOUT
========================================= */

function logout() {

    auth.signOut();

}



/* =========================================
   LOAD PERIODS
========================================= */

function loadPeriods() {

    const list =
        document.getElementById(
            "periodList"
        );


    db.collection("periods")
        .orderBy("periodNo")
        .onSnapshot(

            function(snapshot) {

                list.innerHTML = "";


                if (snapshot.empty) {

                    list.innerHTML = `

                        <div class="loading">

                            No periods found.

                        </div>

                    `;

                    return;

                }


                snapshot.forEach(function(doc) {

                    createPeriodCard(
                        doc.id,
                        doc.data()
                    );

                });

            },

            function(error) {

                console.error(
                    "Firestore Error:",
                    error
                );


                list.innerHTML = `

                    <div class="message error">

                        Database error:
                        ${error.code}

                    </div>

                `;

            }

        );

}



/* =========================================
   CREATE PERIOD CARD
========================================= */

function createPeriodCard(
    id,
    period
) {

    const list =
        document.getElementById(
            "periodList"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "period-card";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "period-title";


    title.textContent =
        "PERIOD " +
        (period.periodNo ?? "");


    card.appendChild(title);



    /* TIME */

    const timeLabel =
        document.createElement(
            "label"
        );

    timeLabel.textContent =
        "Time";

    card.appendChild(timeLabel);


    const timeInput =
        document.createElement(
            "input"
        );

    timeInput.id =
        "time-" + id;

    timeInput.value =
        period.time || "";

    timeInput.placeholder =
        "Example: 8:00-9:00 AM";

    card.appendChild(timeInput);



    /* SUBJECT */

    const subjectLabel =
        document.createElement(
            "label"
        );

    subjectLabel.textContent =
        "Subject";

    card.appendChild(subjectLabel);


    const subjectInput =
        document.createElement(
            "input"
        );

    subjectInput.id =
        "subject-" + id;

    subjectInput.value =
        period.subject || "";

    subjectInput.placeholder =
        "Enter subject";

    card.appendChild(subjectInput);



    /* STATUS */

    const statusLabel =
        document.createElement(
            "label"
        );

    statusLabel.textContent =
        "Status";

    card.appendChild(statusLabel);


    const statusSelect =
        document.createElement(
            "select"
        );

    statusSelect.id =
        "status-" + id;


    const statuses = [

        ["upcoming", "UPCOMING"],

        ["ongoing", "ONGOING"],

        ["completed", "COMPLETED"],

        ["cancelled", "CANCELLED"]

    ];


    statuses.forEach(function(item) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            item[0];

        option.textContent =
            item[1];


        if (
            String(
                period.status || ""
            ).toLowerCase()
            === item[0]
        ) {

            option.selected = true;

        }


        statusSelect.appendChild(
            option
        );

    });


    card.appendChild(
        statusSelect
    );



    /* SAVE */

    const saveButton =
        document.createElement(
            "button"
        );


    saveButton.className =
        "save";


    saveButton.textContent =
        "💾 SAVE PERIOD";


    saveButton.onclick =
        function() {

            savePeriod(id);

        };


    card.appendChild(
        saveButton
    );



    /* DELETE */

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "delete";


    deleteButton.textContent =
        "🗑 DELETE PERIOD";


    deleteButton.onclick =
        function() {

            deletePeriod(id);

        };


    card.appendChild(
        deleteButton
    );



    /* MESSAGE */

    const message =
        document.createElement(
            "div"
        );


    message.id =
        "message-" + id;


    message.className =
        "message";


    card.appendChild(
        message
    );


    list.appendChild(card);

}



/* =========================================
   SAVE PERIOD
========================================= */

function savePeriod(id) {

    const time =
        document.getElementById(
            "time-" + id
        ).value.trim();


    const subject =
        document.getElementById(
            "subject-" + id
        ).value.trim();


    const status =
        document.getElementById(
            "status-" + id
        ).value;


    const message =
        document.getElementById(
            "message-" + id
        );


    if (!time || !subject) {

        message.className =
            "message error";

        message.textContent =
            "Time and subject are required.";

        return;

    }


    db.collection("periods")
        .doc(id)
        .update({

            time: time,

            subject: subject,

            status: status

        })

        .then(function() {

            message.className =
                "message success";

            message.textContent =
                "✓ Saved successfully";


            setTimeout(function() {

                message.textContent = "";

            }, 2500);

        })

        .catch(function(error) {

            console.error(
                "Save error:",
                error
            );


            message.className =
                "message error";

            message.textContent =
                "Save failed: " +
                error.code;

        });

}



/* =========================================
   ADD PERIOD
========================================= */

function addPeriod() {

    db.collection("periods")
        .get()
        .then(function(snapshot) {

            let highestPeriod = 0;


            snapshot.forEach(function(doc) {

                const number =
                    Number(
                        doc.data().periodNo
                    );


                if (
                    number > highestPeriod
                ) {

                    highestPeriod =
                        number;

                }

            });


            const newPeriod =
                highestPeriod + 1;


            db.collection("periods")
                .add({

                    periodNo:
                        newPeriod,

                    time:
                        "00:00-00:00",

                    subject:
                        "NEW SUBJECT",

                    status:
                        "upcoming"

                });

        })

        .catch(function(error) {

            console.error(
                "Add period error:",
                error
            );

            alert(
                "Could not add period: " +
                error.code
            );

        });

}



/* =========================================
   DELETE PERIOD
========================================= */

function deletePeriod(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this period?"
        );


    if (!confirmDelete) {

        return;

    }


    db.collection("periods")
        .doc(id)
        .delete()

        .then(function() {

            console.log(
                "Period deleted"
            );

        })

        .catch(function(error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Delete failed: " +
                error.code
            );

        });

}

</script>


</body>

</html>
